# One origin for the whole stack: storefront at /, other SPAs under
# /admin, /provider, /superadmin, API + artwork reverse-proxied to Express.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:3001;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /images/ {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin { return 301 /admin/; }
    location = /provider { return 301 /provider/; }
    location = /superadmin { return 301 /superadmin/; }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /provider/ {
        try_files $uri $uri/ /provider/index.html;
    }

    location /superadmin/ {
        try_files $uri $uri/ /superadmin/index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /provider/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /superadmin/index.html {
        add_header Cache-Control "no-cache";
    }
}
