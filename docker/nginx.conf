# Serves a Vite SPA and reverse-proxies API + service images to the Express
# backend, so the browser only ever talks to one origin (no CORS, no
# mixed content). Used by all four frontends (storefront, admin, provider,
# superadmin).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving through a variable (instead of a static
    # `upstream`) means a rebuilt/restarted backend container with a new IP is
    # picked up automatically instead of 502-ing until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:3001;

    # Uploads can be large-ish (service artwork posted through the admin).
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Artwork shipped with the SPA wins; anything else (admin uploads living in
    # the backend's public/images) falls through to the backend.
    location /images/ {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
