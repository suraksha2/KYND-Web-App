# Full Helpr stack: MySQL + Next.js API + three Vite SPAs behind nginx.
#
#   cp .env.docker.example .env.docker && edit it
#   docker compose --env-file .env.docker up -d --build
#
# Ports on the host: 8080 storefront, 8081 admin, 8082 provider, 3307 MySQL.
# The API is only reachable through each nginx at /api (no host port), which is
# what the SPAs are built against (VITE_API_BASE=/api).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-urban_service}
      MYSQL_USER: ${MYSQL_USER:-helpr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # Schema + seed data, applied only on first boot (empty data dir).
      - ./backend/db/db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Loopback-only: publishing to 0.0.0.0 would expose the database to the
      # internet on a VPS. Use an SSH tunnel for remote access.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First boot has to import db.sql before it accepts TCP connections;
      # on a small VM that can take well over 30s.
      start_period: 90s

  backend:
    build:
      context: ./backend/db
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-urban_service}
      MYSQL_USER: ${MYSQL_USER:-helpr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # Same-origin via nginx, so only add origins served from another host.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_SIGNUP_SECRET: ${ADMIN_SIGNUP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      AIRWALLEX_ENV: ${AIRWALLEX_ENV:-prod}
      AIRWALLEX_CLIENT_ID: ${AIRWALLEX_CLIENT_ID:-}
      AIRWALLEX_API_KEY: ${AIRWALLEX_API_KEY:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-SGD}
    volumes:
      # Uploads and runtime-edited JSON must outlive the container.
      - backend-images:/app/public/images
      - backend-data:/app/data
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_DIR: .
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_DIR: admin
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_HOST_PORT:-8081}:80"

  provider:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_DIR: provider
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PROVIDER_HOST_PORT:-8082}:80"

volumes:
  mysql-data:
  backend-images:
  backend-data:
