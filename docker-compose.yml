# Full Helpr stack: MySQL + Express API + all four Vite SPAs on one origin.
#
#   cp docker/env.example .env.docker && edit it
#   npm run docker:all
#
# Host ports: 8080 and 3307 MySQL. Default APP_BASE=/mykynd so the stack lives at
# https://fayyaz.travel/mykynd (storefront), /mykynd/admin, /mykynd/provider,
# /mykynd/superadmin, with /mykynd/api proxied to the backend.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-urban_service}
      MYSQL_USER: ${MYSQL_USER:-helpr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # Schema + seed data, applied only on first boot (empty data dir).
      - ./backend/db/db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed/service-subcategories.sql:/docker-entrypoint-initdb.d/02-seed-subcategories.sql:ro
    ports:
      # Loopback-only: publishing to 0.0.0.0 would expose the database to the
      # internet on a VPS. Use an SSH tunnel for remote access.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First boot has to import db.sql before it accepts TCP connections;
      # on a small VM that can take well over 30s.
      start_period: 90s

  backend:
    build:
      context: .
      dockerfile: backend/db/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-urban_service}
      MYSQL_USER: ${MYSQL_USER:-helpr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # Same-origin via nginx, so only add origins served from another host.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_SIGNUP_SECRET: ${ADMIN_SIGNUP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      AIRWALLEX_ENV: ${AIRWALLEX_ENV:-prod}
      AIRWALLEX_CLIENT_ID: ${AIRWALLEX_CLIENT_ID:-}
      AIRWALLEX_API_KEY: ${AIRWALLEX_API_KEY:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-SGD}
    volumes:
      # Runtime-edited JSON must outlive the container.
      #
      # `public/images` is deliberately NOT a volume: service artwork ships in
      # the repo (nothing writes to it at runtime — the admin only picks from
      # the files `/api/images` lists). A volume there would mask the image's
      # own contents, so artwork added in a later push would 404 forever on a
      # server whose volume was created by an earlier deploy.
      - backend-data:/app/data
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
      args:
        APP_BASE: ${APP_BASE:-/mykynd}
        VITE_API_BASE: ${VITE_API_BASE:-/mykynd/api}
    environment:
      APP_BASE: ${APP_BASE:-/mykynd}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

volumes:
  mysql-data:
  backend-data:
